  <header>
    <h1>🔊 신규 스킬 효과음 오디션</h1>
    <p>클릭해서 들어보고 마음에 드는 걸 정해주세요. 인게임과 <b>동일한 Web Audio 합성</b>(getAudioCtx·_sfxTone·_sfxNoise)으로 만들었습니다.</p>
    <div class="hint">각 카드의 재생 버튼을 누르면 소리가 납니다. 결정하신 것만 인게임에 이식하겠습니다.</div>

<script>
// ── 인게임 코드 그대로 (game.js verbatim) ─────────────────────────
let _sharedAudioCtx = null;
function getAudioCtx() {
  if (!_sharedAudioCtx) {
    try { _sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (_sharedAudioCtx.state === 'suspended') { try { _sharedAudioCtx.resume(); } catch (e) {} }
  return _sharedAudioCtx;
}
function _sfxTone(ctx, time, freq, dur, type, gain, glide) {
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, time);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide, time + dur);
  g.gain.setValueAtTime(0.001, time);
  g.gain.linearRampToValueAtTime(gain || 0.1, time + Math.min(0.02, dur * 0.2));
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(time); o.stop(time + dur + 0.02);
}
function _sfxNoise(ctx, time, dur, gain, hpFreq, lpFreq) {
  const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * dur)), ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain();
  g.gain.setValueAtTime(gain || 0.1, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  let node = src;
  if (hpFreq) { const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hpFreq; node.connect(f); node = f; }
  if (lpFreq) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lpFreq; node.connect(f); node = f; }
  node.connect(g); g.connect(ctx.destination);
  src.start(time); src.stop(time + dur);
}

// ── 신규 스킬 효과음 후보 (인게임 이식 대상) ──────────────────────
const SFX = {
  // ─ 악인 ─
  venomCloud(ctx, now) { // 맹독 구름
    _sfxNoise(ctx, now, 0.5, 0.05, 300, 1800);
    _sfxTone(ctx, now + 0.05, 180, 0.38, 'sine', 0.05, 90);
    _sfxTone(ctx, now + 0.16, 150, 0.34, 'sine', 0.045, 72);
    _sfxNoise(ctx, now + 0.22, 0.28, 0.03, 500, 2600);
  },
  omen(ctx, now) { // 흉조 — 까악 까악 (더 까마귀답게)
    const caw = (t, base) => {
      // "ㄲ" 어택 상승 → "아악" 하강 본체가 끊김 없이 이어짐 + 톱니 러프 + 나잘 하모닉 + 라스프
      _sfxTone(ctx, t,        base * 1.3,  0.05, 'sawtooth', 0.08, base * 1.75);  // 어택 상승
      _sfxTone(ctx, t + 0.05, base * 1.75, 0.22, 'sawtooth', 0.12, base * 0.82);  // 하강 본체(까~악)
      _sfxTone(ctx, t + 0.05, base * 1.77, 0.22, 'sawtooth', 0.05, base * 0.83);  // 디튠 러프니스
      _sfxTone(ctx, t + 0.05, base * 3.4,  0.18, 'square',   0.03, base * 1.7);   // 나잘 하모닉(까마귀 특유)
      _sfxNoise(ctx, t, 0.07, 0.045, 1400, 5200);                                 // 목 긁는 라스프
    };
    caw(now, 500);
    caw(now + 0.42, 460);
    _sfxTone(ctx, now, 90, 0.9, 'sine', 0.03, 70);   // 아주 옅은 불길한 저음(까마귀 우선)
  },
  fateShift(ctx, now) { // 운명변곡 (상태이상 이동)
    _sfxTone(ctx, now, 400, 0.5, 'sine', 0.06, 940);
    _sfxTone(ctx, now, 940, 0.5, 'sine', 0.055, 400);
    _sfxTone(ctx, now + 0.5, 660, 0.14, 'triangle', 0.06);
  },
  raise(ctx, now) { // 강령술 (부활)
    _sfxTone(ctx, now, 90, 0.6, 'sawtooth', 0.06, 230);
    _sfxTone(ctx, now + 0.2, 300, 0.5, 'sine', 0.05, 520);
    _sfxNoise(ctx, now, 0.42, 0.03, 200, 800);
  },
  command(ctx, now) { // 조종 (악령 강제)
    _sfxTone(ctx, now, 210, 0.14, 'square', 0.07);
    _sfxTone(ctx, now + 0.12, 150, 0.32, 'sawtooth', 0.06, 118);
    _sfxNoise(ctx, now + 0.02, 0.18, 0.025, 120, 900);
  },
  exhume(ctx, now) { // 도굴 (유해 제거 + SP)
    _sfxNoise(ctx, now, 0.18, 0.06, 100, 900);
    _sfxTone(ctx, now + 0.22, 900, 0.1, 'sine', 0.08);
    _sfxTone(ctx, now + 0.32, 1300, 0.14, 'sine', 0.07);
  },
  corrupt(ctx, now) { // 타락 — 마왕(악인 보스)의 장엄하고 어두운 악마 성가 (종언의 다크 카운터파트)
    // ① 심연의 서브베이스 토대 — 거부할 수 없는 무게
    _sfxTone(ctx, now, 48, 1.9, 'sine', 0.11, 40);
    _sfxTone(ctx, now, 55, 1.9, 'sawtooth', 0.05, 46);        // 낮은 그르렁 그로울
    _sfxNoise(ctx, now, 1.8, 0.03, 25, 180);                  // 어두운 럼블
    _sfxTone(ctx, now, 82, 0.9, 'sine', 0.06, 62);            // 낮은 공명 타격(장엄)
    // ② 악마 성가 — 단조 + 트라이톤 대화음, 한 음씩 어둡게 페이드인(디튠 그로울)
    const demon = (f, g, delay) => {
      _sfxTone(ctx, now + delay, f,         1.9 - delay, 'sawtooth', g,       f * 0.995);
      _sfxTone(ctx, now + delay, f * 1.006, 1.9 - delay, 'sawtooth', g * 0.6, f * 0.99);   // 러프 디튠
    };
    demon(131, 0.05, 0.0);    // C3
    demon(156, 0.045, 0.15);  // Eb3 (단3도 — 어둠)
    demon(196, 0.045, 0.3);   // G3
    demon(233, 0.04, 0.45);   // Bb3
    demon(185, 0.035, 0.6);   // F#3 (트라이톤 — '악마의 음정')
    // ③ 거부하지 못하는 공포의 상승 스웰
    _sfxTone(ctx, now + 0.7, 98, 1.1, 'sawtooth', 0.05, 300);
    // ④ 악마의 숨결 라스프
    _sfxNoise(ctx, now + 0.3, 1.2, 0.025, 300, 2200);
  },
  steal(ctx, now) { // 강탈 (SP 탈취)
    _sfxNoise(ctx, now, 0.06, 0.05, 2000, 6500);
    _sfxTone(ctx, now + 0.06, 1800, 0.12, 'triangle', 0.08, 2700);
    _sfxTone(ctx, now + 0.14, 2500, 0.1, 'sine', 0.05);
  },
  // ─ 정령 ─
  spread(ctx, now) { // 확산 (진균)
    _sfxNoise(ctx, now, 0.08, 0.05, 500, 2500);
    _sfxTone(ctx, now + 0.05, 220, 0.26, 'sine', 0.05, 330);
    _sfxNoise(ctx, now + 0.14, 0.08, 0.04, 400, 2100);
    _sfxNoise(ctx, now + 0.26, 0.07, 0.03, 450, 2300);
  },
  fairyDust(ctx, now) { // 페어리 더스트 (행운)
    for (let i = 0; i < 6; i++) _sfxTone(ctx, now + i * 0.055, 1500 + Math.random() * 1400, 0.13, 'sine', 0.045);
  },
  bless(ctx, now) { // 축복 (정령 ATK+)
    _sfxTone(ctx, now, 784, 0.55, 'sine', 0.05);
    _sfxTone(ctx, now, 988, 0.55, 'sine', 0.04);
    _sfxTone(ctx, now, 1175, 0.55, 'sine', 0.03);
    for (let i = 0; i < 4; i++) _sfxTone(ctx, now + 0.1 + i * 0.06, 2200 + Math.random() * 800, 0.1, 'sine', 0.025);
  },
  grace(ctx, now) { // 은혜 (정령 회복)
    _sfxTone(ctx, now, 660, 0.16, 'sine', 0.06, 990);
    _sfxTone(ctx, now + 0.16, 990, 0.32, 'sine', 0.05, 1320);
  },
  endAll(ctx, now) { // 종언 — 세계 최후, 요정들의 성스러운 찬양 (웅장·경외 ~2s)
    // ① 깊은 심연의 토대
    _sfxTone(ctx, now, 55, 1.9, 'sine', 0.09, 45);
    _sfxNoise(ctx, now, 1.7, 0.02, 30, 200);
    // ② 성스러운 대화음 (Cmaj9) — 한 음씩 페이드인, 요정 합창 느낌
    const choir = (f, g, delay) => _sfxTone(ctx, now + delay, f, 1.95 - delay, 'sine', g, f * 1.004);
    choir(262, 0.05, 0.0);    // C
    choir(330, 0.045, 0.13);  // E
    choir(392, 0.045, 0.26);  // G
    choir(494, 0.04, 0.4);    // B
    choir(587, 0.035, 0.55);  // D(9th)
    choir(784, 0.03, 0.7);    // G
    // ③ 천상의 반짝임 — 고음 찬양(랜덤 shimmer)
    for (let i = 0; i < 11; i++) _sfxTone(ctx, now + 0.5 + i * 0.12, 1568 + Math.random() * 1500, 0.4, 'sine', 0.02);
    // ④ 경외의 상승 스웰
    _sfxTone(ctx, now + 0.9, 392, 1.05, 'triangle', 0.04, 1046);
  },
  morph(ctx, now) { // 변이 (호문클루스 영구변신)
    _sfxTone(ctx, now, 300, 0.4, 'sine', 0.06, 620);
    _sfxTone(ctx, now + 0.15, 620, 0.3, 'sine', 0.05, 250);
    _sfxTone(ctx, now + 0.3, 250, 0.24, 'sine', 0.05, 480);
    _sfxNoise(ctx, now + 0.1, 0.15, 0.03, 200, 1000);
  },
  // ─ 왕실/무소속 ─
  troopAttack(ctx, now) { // 부대공격 — 길고 멜로디있는 장엄한 팡파레 (~1.5s)
    const brass = (t, f, d, g) => { _sfxTone(ctx, t, f, d, 'sawtooth', g); _sfxTone(ctx, t, f * 2, d, 'sawtooth', g * 0.4); };
    brass(now,        392, 0.22, 0.06);   // G4
    brass(now + 0.2,  523, 0.22, 0.06);   // C5
    brass(now + 0.4,  659, 0.28, 0.07);   // E5
    brass(now + 0.68, 784, 0.6,  0.08);   // G5 정점(지속)
    _sfxTone(ctx, now + 0.68, 262, 0.85, 'sawtooth', 0.04);  // C4 하부 베드
    _sfxTone(ctx, now + 0.68, 392, 0.85, 'sawtooth', 0.03);  // G4 하부 베드
    _sfxNoise(ctx, now,        0.12, 0.05, 60, 400);          // 북
    _sfxNoise(ctx, now + 0.4,  0.12, 0.05, 60, 400);
    _sfxNoise(ctx, now + 0.68, 0.18, 0.06, 60, 400);
  },
  decree(ctx, now) { // 칙명 (왕실 추가행동)
    _sfxTone(ctx, now, 523, 0.15, 'triangle', 0.07);
    _sfxTone(ctx, now + 0.12, 659, 0.15, 'triangle', 0.07);
    _sfxTone(ctx, now + 0.24, 784, 0.28, 'triangle', 0.08);
  },
  demolish(ctx, now) { // 파괴공작 — 더 폭발하는 소리
    _sfxTone(ctx, now, 120, 0.15, 'square', 0.09, 50);    // 초기 타격
    _sfxTone(ctx, now, 68, 0.5, 'sine', 0.13, 34);        // 서브베이스 붐
    _sfxNoise(ctx, now, 0.42, 0.12, 40, 1300);            // 폭발 바디
    _sfxNoise(ctx, now + 0.02, 0.26, 0.08, 800, 5200);    // 밝은 파편
    _sfxNoise(ctx, now + 0.22, 0.3, 0.045, 200, 2500);    // 잔해 낙하
  },
  windPush(ctx, now) { // 바람몰이 (강제이동)
    _sfxNoise(ctx, now, 0.4, 0.06, 400, 3000);
    _sfxNoise(ctx, now + 0.1, 0.3, 0.04, 900, 4200);
    _sfxTone(ctx, now + 0.02, 600, 0.35, 'sine', 0.02, 1400);
  },
  drive(ctx, now) { // 구동 (투석기 이동) — 더 기계적인 톱니 래칫
    for (let i = 0; i < 7; i++) {
      _sfxTone(ctx, now + i * 0.05, 150 + (i % 2) * 45, 0.028, 'square', 0.06);  // 래칫 클릭
      _sfxNoise(ctx, now + i * 0.05, 0.022, 0.035, 2200, 6500);                 // 금속 클랭크
    }
    _sfxTone(ctx, now, 85, 0.4, 'square', 0.05, 68);   // 낮은 모터 험
    _sfxNoise(ctx, now, 0.4, 0.02, 90, 480);
  },
  sirenSong(ctx, now) { // 사이렌 송 — 끊김 없이 아름다움→비명으로 연속 상승
    // ① 사인 본체: 500→1900 하나의 긴 연속 상승(아름다운 웨일이 그대로 긴장으로). 끊기지 않는 척추.
    _sfxTone(ctx, now, 500, 1.4, 'sine', 0.07, 1900);
    _sfxTone(ctx, now, 503, 1.4, 'sine', 0.035, 1912);           // 디튠 비트(끝까지 유지)
    _sfxTone(ctx, now + 0.15, 990, 1.2, 'sine', 0.03, 2700);     // 하모닉도 함께 연속 상승
    // ② 톱니 비명 레이어 — 사인 궤적과 같은 피치대(≈1000)에서 시작해 위로 이어짐(점프 없음).
    //    사인이 계속 울리는 위에 거친 톱니가 겹쳐 올라가며 자연스레 비명으로 변모.
    _sfxTone(ctx, now + 0.55, 1000, 0.85, 'sawtooth', 0.05, 2900);
    _sfxTone(ctx, now + 0.55, 1013, 0.85, 'sawtooth', 0.035, 2850);  // 불협 디튠
    _sfxTone(ctx, now + 0.62, 1600, 0.75, 'square', 0.028, 3300);    // 날카로운 상단(겹쳐 상승)
    _sfxNoise(ctx, now + 0.6, 0.6, 0.03, 2200, 7200);                // 공포 쉭(길게 겹침)
  },
};

const SKILLS = [
  { k:'venomCloud', nm:'맹독 구름', unit:'독살꾼', t:'villain', d:'독가스 쉭— + 낮게 부글대는 저음' },
  { k:'omen',       nm:'흉조',      unit:'포춘텔러', t:'villain', d:'까악 까악 — 더 까마귀다운 울음 2회' },
  { k:'fateShift',  nm:'운명변곡',  unit:'포춘텔러', t:'villain', d:'교차하는 상승·하강 글라이드(맞바꿈)' },
  { k:'raise',      nm:'강령술',    unit:'악령술사', t:'villain', d:'낮게 솟아오르는 강령 드론 + 유령음' },
  { k:'command',    nm:'조종',      unit:'악령술사', t:'villain', d:'명령 펄스 + 어두운 잔향' },

  { k:'fairyDust',  nm:'페어리 더스트', unit:'요정', t:'spirit',  d:'반짝반짝 흩뿌리는 고음 샤워' },

  { k:'endAll',     nm:'종언',      unit:'오베론',   t:'spirit',  d:'세계 최후·요정 성가(Cmaj9)+천상 반짝임 (~2s 웅장·경외)' },
  { k:'morph',      nm:'변이',      unit:'호문클루스', t:'none',  d:'꿀렁이는 변신 워블 + 스퀴시' },
  { k:'troopAttack',nm:'부대공격',  unit:'장군',     t:'royal',   d:'장엄한 팡파레 멜로디(~1.5s) G4→C5→E5→G5 + 북' },
  { k:'decree',     nm:'칙명',      unit:'국왕',     t:'royal',   d:'밝은 상승 팡파르(C-E-G)' },
  { k:'demolish',   nm:'파괴공작',  unit:'공성파괴자', t:'royal', d:'서브베이스 폭발 붐 + 파편·잔해(더 폭발적)' },
  { k:'windPush',   nm:'바람몰이',  unit:'—',        t:'none',    d:'휘몰아치는 바람 스윕' },
  { k:'drive',      nm:'구동',      unit:'투석기',   t:'none',    d:'톱니 래칫 연속 클랭크 + 모터 험(더 기계적)' },
  { k:'sirenSong',  nm:'사이렌 송', unit:'샘의인어', t:'none',    d:'끊김 없는 연속 상승 — 아름다운 웨일이 그대로 비명으로' },
];

const grid = document.getElementById('grid');
for (const s of SKILLS) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    `<div class="top"><span class="nm">${s.nm}</span><span class="tag t-${s.t}">${s.unit}</span></div>` +
    `<div class="desc">${s.d}</div>` +
    `<button>▶ 재생</button>`;
  const btn = card.querySelector('button');
  btn.addEventListener('click', () => {
    const ctx = getAudioCtx(); if (!ctx) return;
    try { SFX[s.k](ctx, ctx.currentTime); } catch (e) { console.error(s.k, e); }
    btn.classList.add('playing');
    setTimeout(() => btn.classList.remove('playing'), 500);
  });
  grid.appendChild(card);
}
</script>
