<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중독 심화 도장</title>
<!-- 실제 인게임 스타일 그대로 — 카드·HP바·상태배지·데미지 도장·로그 모두 style.css 원본 -->
<link rel="stylesheet" href="style.css?v=20261024d">
<script src="poison-urchin.js?v=20261024d"></script>
<style>
  /* ── 프리뷰 레이아웃 전용 ── */
  body { background: var(--bg, #0f0f1a); margin: 0; padding: 14px 16px; overflow-x: hidden; display: block !important; min-height: 0 !important; }
  .pv-head { text-align: center; margin-bottom: 10px; }
  .pv-head h1 { margin: 0 0 4px; font-size: 1.15rem; color: var(--accent); letter-spacing: 0.04em; }
  .pv-head p { margin: 0 auto; max-width: 720px; font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
  .pv-ctrl { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 8px 0 12px; }
  .pv-ctrl button { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 6px 12px; font-size: 0.78rem; cursor: pointer; }
  .pv-ctrl button.on { border-color: #a3e635; color: #d9f99d; }
  .pv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 300px)); gap: 18px; justify-content: center; }
  @media (max-width: 680px) { .pv-grid { grid-template-columns: minmax(0, 1fr); } }
  .pv-case { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px 12px; }
  .pv-case h2 { margin: 0 0 2px; font-size: 0.86rem; color: var(--text); }
  .pv-case .cap { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; line-height: 1.45; }
  .pv-case .side-panel { width: 100%; }
  .pv-case .replay { width: 100%; margin-top: 2px; background: #1a2e05; color: #d9f99d; border: 1px solid #4d7c0f; border-radius: 7px; padding: 6px; font-size: 0.76rem; cursor: pointer; }
  .pv-log { margin-top: 8px; max-height: 120px; overflow: hidden; }
  .pv-log .log-entry { font-size: 0.72rem; }

  /* 상태배지 단계 상승 순간 펄스 */
  .status-badge.poison.stack-up { animation: poison-badge-up 0.9s ease-out 1; }
  @keyframes poison-badge-up {
    0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(163,230,53,0.9); }
    30%  { transform: scale(1.18); box-shadow: 0 0 0 5px rgba(163,230,53,0.35); }
    100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(163,230,53,0); }
  }
</style>
</head>
<body>
  <div class="pv-head">
    <h1>중독 심화 도장</h1>
    <p>중독 스택이 쌓이는 순간 프로필 카드에 붙는 원형 성게 말풍선 도장입니다. 단계는 카드 아래 배지에서 올라갑니다. 데미지 도장과 같은 자리 규칙을 따르며, 팝업 없이 로그에만 원인을 남깁니다. 카드·HP바·배지·로그는 실제 인게임 스타일 그대로입니다.</p>
  </div>
  <div class="pv-grid">
    <section class="pv-case">
      <h2>① 독살꾼에게 공격받은 유닛</h2>
      <div class="cap">공격 피해 도장이 먼저 찍히고, 이어서 중독 심화 도장이 그 아래 슬롯에 찍힙니다.</div>
      <div class="side-panel left-panel turn-active"><div id="c1"></div></div>
      <button class="replay" id="r1">▶ 다시 재생</button>
      <div class="pv-log center-log-wrap"><div id="l1"></div></div>
    </section>
    <section class="pv-case">
      <h2>② 진균지대에서 턴 종료</h2>
      <div class="cap">턴을 마친 순간 진균지대 위 유닛마다 저티어부터 차례로 중독 심화 도장이 찍힙니다.</div>
      <div class="side-panel left-panel turn-active"><div id="c2"></div></div>
      <button class="replay" id="r2">▶ 다시 재생</button>
      <div class="pv-log center-log-wrap"><div id="l2"></div></div>
    </section>
  </div>

<script>
// 실제 renderMyPieces 출력 마크업(인게임 캡처)과 동일한 카드 템플릿.
const FACTION = { royal: '왕실', spirit: '정령', villain: '악인' };
function cardHtml(u) {
  const hpPct = u.hp / u.maxHp * 100;
  const startPct = u.startHp / u.maxHp * 100;
  const dmgOv = u.hp < u.startHp ? `<div class="hp-bar-damage" style="left:${hpPct}%;width:${startPct - hpPct}%"></div>` : '';
  const badge = u.stack > 0
    ? `<div class="status-badges"><span class="status-badge poison"><i class="sb-ic">☣</i><span class="sb-label">중독</span> <i class="sb-stack">${u.stack}단계</i></span></div>`
    : `<div class="status-badges"></div>`;
  return `<div class="my-piece-card turn-bright ${u.stack > 0 ? 'poison-active' : ''}" style="position: relative;">
      <div class="my-piece-header">
        <span class="p-icon"><img src="/assets/icons/${u.type}.png" alt="" class="piece-icon-img " style="width:1.3em;height:1.3em;vertical-align:middle;object-fit:contain;" draggable="false"></span>
        <strong class="">${u.name}</strong>
        <span class="tier-badge">${u.tier}T</span>
        <span class="tag-badge ${u.faction}" title="${FACTION[u.faction]}"><img class="tag-stamp" src="/assets/factions/${u.faction}.png" alt="${FACTION[u.faction]}"></span>
      </div>
      ${u.passive ? `<div class="piece-mini-headers"><span class="mini-header mini-header-passive">${u.passive}</span></div>` : ''}
      <div class="hp-bar-bg hp-bar-with-text">
        <div class="hp-bar" style="width:${hpPct}%"></div>
        ${dmgOv}
        <span class="hp-bar-text">${u.hp}/${u.maxHp}</span>
      </div>
      <div class="piece-stat-row">
        <span class="piece-stat-atk"><span class="stat-label">ATK</span> ${u.atk}</span>
        <span class="my-piece-pos">${u.pos}</span>
      </div>
      ${badge}
    </div>`;
}
function logHtml(turn, msg, type) { return `<div class="log-entry ${type}"><span class="turn-num">T${turn}</span> ${msg}</div>`; }
const wait = (ms) => new Promise(r => setTimeout(r, ms));

function stamp(card, cls, html) {
  const d = document.createElement('div');
  d.className = `dmg-stamp ${cls}`;
  d.innerHTML = html;
  card.appendChild(d);
}
// 중독 심화 순간 — 도장 + 배지 단계 상승(펄스). 데미지 도장이 있으면 아래 슬롯.
function poisonUp(card, newStack) {
  const hasTop = !!card.querySelector('.dmg-stamp:not(.poison-up)');
  stamp(card, `poison-up${hasTop ? ' stack-2' : ''}`, `${window.POISON_URCHIN_SVG}<span>중독<br>심화</span>`);
  card.classList.add('poison-active');
  let badges = card.querySelector('.status-badges');
  let b = badges.querySelector('.status-badge.poison');
  if (!b) { badges.innerHTML = `<span class="status-badge poison"><i class="sb-ic">☣</i><span class="sb-label">중독</span> <i class="sb-stack"></i></span>`; b = badges.querySelector('.status-badge.poison'); }
  b.querySelector('.sb-stack').textContent = `${newStack}단계`;
  b.classList.remove('stack-up'); void b.offsetWidth; b.classList.add('stack-up');
}

let run1 = 0, run2 = 0;
async function case1() {
  const my = ++run1;
  const c = document.getElementById('c1'), l = document.getElementById('l1');
  c.innerHTML = cardHtml({ type: 'wizard', name: '마법사', tier: 2, faction: 'spirit', passive: '인스턴트매직', hp: 3, startHp: 3, maxHp: 3, atk: 2, pos: 'C3', stack: 1 });
  l.innerHTML = logHtml(5, '5턴 : AI 차례', 'system');
  await wait(700); if (my !== run1) return;
  const card = c.querySelector('.my-piece-card');
  // 피격 — 실제 피격 흔들림(profile-hit) + 빨간 데미지 도장
  c.innerHTML = cardHtml({ type: 'wizard', name: '마법사', tier: 2, faction: 'spirit', passive: '인스턴트매직', hp: 2, startHp: 3, maxHp: 3, atk: 2, pos: 'C3', stack: 1 });
  const card2 = c.querySelector('.my-piece-card');
  card2.classList.add('profile-hit');
  stamp(card2, '', '1 데미지');
  l.innerHTML = logHtml(5, '마법사 피격 1 피해', 'hit') + l.innerHTML;
  await wait(650); if (my !== run1) return;
  poisonUp(card2, 2);
  l.innerHTML = logHtml(5, '독살꾼의 공격에 의해 마법사의 중독단계 상승', 'dot-poison') + l.innerHTML;
}
async function case2() {
  const my = ++run2;
  const c = document.getElementById('c2'), l = document.getElementById('l2');
  c.innerHTML =
    cardHtml({ type: 'spearman', name: '창병', tier: 1, faction: 'royal', passive: '', hp: 4, startHp: 4, maxHp: 4, atk: 1, pos: 'B2', stack: 0 }) +
    cardHtml({ type: 'prince', name: '왕자', tier: 3, faction: 'royal', passive: '계승자', hp: 3, startHp: 3, maxHp: 3, atk: 2, pos: 'D4', stack: 2 });
  l.innerHTML = logHtml(6, '6턴 : 테스터 차례', 'system');
  await wait(800); if (my !== run2) return;
  const cards = c.querySelectorAll('.my-piece-card');
  poisonUp(cards[0], 1);
  l.innerHTML = logHtml(6, '진균지대에 노출되어 창병의 중독단계 상승', 'dot-poison') + l.innerHTML;
  await wait(650); if (my !== run2) return;
  poisonUp(cards[1], 3);
  l.innerHTML = logHtml(6, '진균지대에 노출되어 왕자의 중독단계 상승', 'dot-poison') + l.innerHTML;
}
document.getElementById('r1').onclick = case1;
document.getElementById('r2').onclick = case2;
case1(); case2();
</script>
</body>
</html>
